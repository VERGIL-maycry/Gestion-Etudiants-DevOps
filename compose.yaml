services:
  scolarite:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - donnees:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 8
volumes:
  donnees:
